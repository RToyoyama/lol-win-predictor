[project]
name = "lol-win"
version = "0.1.0"
description = "Probabilidade de vitória do lado azul aos 10 minutos de partidas ranqueadas de League of Legends."
readme = "README.md"
requires-python = ">=3.11,<3.12"
authors = [{ name = "Renan Toyoyama" }]
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pandera>=0.20",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "optuna>=4.0",
    "shap>=0.46",
    "statsmodels>=0.14",
    "scipy>=1.13",
    "mlflow>=2.16",
    "joblib>=1.4",
    "fastapi>=0.115",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
    "streamlit>=1.38",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "seaborn>=0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_win"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "N", "PD", "NPY"]
ignore = ["D100", "D104", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"notebooks/**" = ["D", "E402"]

[tool.ruff.lint.isort]
known-first-party = ["lol_win"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
