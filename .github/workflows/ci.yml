name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  MPLBACKEND: Agg

jobs:
  lint-test:
    name: Lint + testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Testes
        run: uv run pytest --cov=lol_win --cov-report=term-missing:skip-covered

  smoke-train:
    name: Smoke test do pipeline de modelagem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Instalar dependências
        run: uv sync --frozen

      - name: Dados (raw → bronze → silver → gold)
        run: make data features

      - name: Treino com CV (amostra pequena)
        run: uv run python -m lol_win.models.train --sample 600 --folds 3

      - name: Tuning (amostra pequena, 3 trials)
        run: uv run python -m lol_win.models.tune --sample 400 --trials 3

      - name: Export do campeão
        run: |
          uv run python -m lol_win.models.export --output-dir "$RUNNER_TEMP/models"
          test -s "$RUNNER_TEMP/models/model.joblib"
          test -s "$RUNNER_TEMP/models/metadata.json"
          test -s "$RUNNER_TEMP/models/background.parquet"

  docker:
    name: Build + smoke test da imagem
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lol-win-predictor:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Subir api + app
        run: docker compose up -d --wait --no-build

      - name: Smoke test da API
        run: |
          curl -fsS http://localhost:8000/health
          docker compose exec -T api python -c "import json; from lol_win.api.schemas import MatchStats; print(json.dumps(MatchStats.model_config['json_schema_extra']['examples'][0]))" > payload.json
          curl -fsS -X POST http://localhost:8000/predict -H 'content-type: application/json' -d @payload.json | tee response.json
          python3 -c "import json; r = json.load(open('response.json')); assert 0 <= r['p_blue_win'] <= 1 and r['faixa']['label'], r"

      - name: Smoke test do app
        run: curl -fsS http://localhost:8501/_stcore/health

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derrubar containers
        if: always()
        run: docker compose down
